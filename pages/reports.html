<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>日報一覧</title>

<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/reports.css">

</head>


<body>


<header class="app-header">

    <h1>📋 日報一覧</h1>

</header>


<main class="reports-container">


    <!-- =========================
         🔍 キーワード検索
    ========================== -->

    <div class="search-box">

        <input 
            id="searchInput"
            type="text"
            placeholder="顧客名・担当者・作業内容で検索"
        >

    </div>



    <!-- =========================
         👤 担当者
    ========================== -->

    <div class="filter-box">

        <select id="personFilter">

            <option value="">
                👤 担当者：全員
            </option>

        </select>


        <!-- =========================
             📅 年月
        ========================== -->

        <input
            id="monthFilter"
            type="month"
        >


        <!-- =========================
             📝 状態
        ========================== -->

        <select id="statusFilter">

            <option value="">
                📝 状態：すべて
            </option>

            <option value="submitted">
                ✅ 提出済み
            </option>

            <option value="draft">
                📝 下書き
            </option>

        </select>


        <button
            type="button"
            id="clearFilterBtn"
        >
            🔄 条件をクリア
        </button>

    </div>



    <!-- =========================
         日報一覧
    ========================== -->

    <div id="reportList">

        読み込み中...

    </div>


</main>
