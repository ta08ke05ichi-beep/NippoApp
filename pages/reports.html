    href="../css/common.css"

>

<body>


<header class="app-header">

    <h1>📋 日報一覧</h1>

</header>


<main class="reports-container">


    <!-- ==========================
         🔍 キーワード検索
    =========================== -->

    <div class="search-box">

        <input
            id="searchInput"
            type="text"
            placeholder="顧客名・担当者・作業内容で検索"
        >

    </div>


    <!-- ==========================
         🔎 絞り込み
    =========================== -->

    <div class="filter-box">


        <!-- 担当者 -->

<div class="filter-item">

    <label for="personFilter">
        👤 担当者
    </label>

    <select id="personFilter">

        <option value="">
            全員
        </option>

    </select>

</div>


        <!-- 年月 -->

        <div class="filter-item">

    <label for="monthFilter">
        📅 年月
    </label>

    <select id="monthFilter"></select>

</div>


       <!-- 状態 -->

<div class="filter-item">

    <label for="statusFilter">
        📝 状態
    </label>

    <select id="statusFilter">

        <option value="">
            すべて
        </option>

        <option value="submitted">
            ✅ 提出済み
        </option>

        <option value="draft">
            📝 下書き
        </option>

    </select>

</div>


    </div>


    <!-- ==========================
         📋 日報一覧
    =========================== -->

    <div id="reportList">

        読み込み中...

    </div>


</main>
