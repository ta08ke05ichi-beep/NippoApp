<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>日報入力</title>

<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/report.css">

<link rel="manifest" href="../manifest.json">

</head>


<body>


<header>

<h1>📝 日報入力</h1>

</header>



<main class="report-container">



<div class="task-card">


<label>日付</label>

<input
type="date"
id="date">



<label>名前</label>

<select id="name">

<option value="">
選択してください
</option>

<option>竹市</option>
<option>坂田</option>
<option>酒井</option>
<option>太田（社長）</option>
<option>西田</option>
<option>太田（相談役）</option>

</select>


</div>





<div id="tasks">


<div class="task-card">


<h2>
訪問①
</h2>

<label>
顧客
</label>


<input
type="text"
class="customer-search"
placeholder="顧客名を検索">


<div class="customer-result"></div>


<input
type="hidden"
class="customer-value">

<div class="customer-detail">

<p><strong>会社名：</strong><span class="customer-name"></span></p>

<p><strong>住所：</strong><span class="customer-address"></span></p>

<p><strong>TEL：</strong><span class="customer-tel"></span></p>

</div>


<label>
開始時間
</label>


<input
type="time"
class="start-time">





<label>
終了時間
</label>


<input
type="time"
class="end-time">






<label>
作業分類
</label>


<select
class="work">


<option value="">
選択してください
</option>

<option>点検</option>
<option>修理</option>
<option>設置</option>
<option>社内業務</option>
<option>その他</option>


</select>






<label>
作業内容
</label>


<textarea
class="content"
placeholder="作業した内容を入力してください">
</textarea>



</div>


</div>





<button id="addTaskBtn">

＋ 訪問追加

</button>



<button id="saveBtn">

保存する

</button>




</main>







<nav class="bottom-nav">


<a href="../index.html">
ホーム
</a>


<a href="report.html">
日報入力
</a>


<a href="reports.html">
日報一覧
</a>


<a href="customers.html">
顧客一覧
</a>


</nav>






<script type="module" src="../js/report.js"></script>



</body>

</html>
