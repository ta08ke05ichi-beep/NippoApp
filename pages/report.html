<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>日報入力</title>

<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/report.css">

<link rel="manifest" href="../manifest.json">

</head>


<body>


<header>

<h1>📝 日報入力</h1>

</header>


<main class="report-container">


<div class="card">


<label>日付</label>

<input 
type="date" 
id="date">


<label>名前</label>

<select id="name">

<option value="">選択してください</option>
<option>竹市</option>
<option>坂田</option>
<option>酒井</option>
<option>太田（社長）</option>
<option>西田</option>
<option>太田（相談役）</option>

</select>



<label>顧客</label>

<select id="customer">

<option value="">顧客を選択してください</option>

</select>



<label>作業分類</label>

<select id="work">

<option value="">選択してください</option>
<option>点検</option>
<option>修理</option>
<option>設置</option>
<option>打ち合わせ</option>
<option>その他</option>

</select>



<label>作業内容</label>

<textarea 
id="content"
placeholder="作業した内容を入力してください">
</textarea>



<label>作業時間</label>

<input 
type="text"
id="time"
placeholder="例：2時間">



<button id="saveBtn">

保存する

</button>


</div>


</main>

</nav>



<script type="module" src="../js/report.js"></script>


</body>

</html>
