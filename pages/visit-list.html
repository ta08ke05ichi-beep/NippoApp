<!DOCTYPE html>

<head>

<meta charset="UTF-8">

<meta

    content="width=device-width, initial-scale=1.0"

<title>今月の訪問一覧</title>

<link
    rel="stylesheet"
    href="../css/common.css"
>

<link
    rel="stylesheet"
    href="../css/visit-list.css"
>

</head>


<body>


<header>

<h1>🚗 今月の訪問一覧</h1>

</header>


<main>

    <!-- 絞り込み -->

    <div class="filter-card">

        <label>担当者</label>

        <select id="nameFilter">
            <option value="全員">全員</option>
        </select>


        <label>顧客名</label>

        <input
            type="text"
            id="customerFilter"
            placeholder="顧客名で検索"
        >

    </div>


    <!-- 訪問件数 -->

    <div class="visit-summary">

        🚗 今月の訪問
        <strong id="visitCount">0件</strong>

    </div>


    <!-- 訪問一覧 -->

    <div id="visitList">

        読み込み中...

    </div>


    <button id="backBtn">

        ← ホームへ戻る

    </button>

</main>
