<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>日報編集</title>


<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/edit.css">


</head>



<body>



<header>

<h1>✏️ 日報編集</h1>

</header>




<main>



<div class="card">


<label>
担当者
</label>


<select id="name">

<option>竹市</option>
<option>坂田</option>
<option>酒井</option>
<option>太田（社長）</option>
<option>西田</option>
<option>太田（相談役）</option>

</select>



</div>





<div class="card">


<label>
日付
</label>


<input 
type="date"
id="date">



</div>






<div class="card">


<label>
顧客
</label>


<select id="customer">


<option value="">
選択してください
</option>


</select>



</div>






<div class="card">


<label>
作業分類
</label>


<input
type="text"
id="work"
placeholder="例：点検・修理・設置">



</div>







<div class="card">


<label>
作業内容
</label>


<textarea
id="content"
placeholder="作業内容を入力してください">
</textarea>



</div>







<div class="card">


<label>
作業時間
</label>


<input
type="text"
id="time"
placeholder="例：2時間">



</div>







<button id="saveBtn">

更新する

</button>



</main>







<script type="module" src="../js/edit.js"></script>


</body>

</html>
