<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>顧客一覧</title>

<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/customers.css">

</head>

<body>

<header>

<h1>🏢 顧客一覧</h1>

</header>

<main>

<button id="addCustomerBtn">
＋ 顧客追加
</button>

<div class="card">

<h2>📥 CSV取込</h2>

<input
type="file"
id="csvFile"
accept=".csv">

<button id="importBtn">

CSVを取り込む

</button>

<button id="deleteAllBtn">
顧客データを全部削除
</button>

<p id="importStatus"></p>

</div>

<input
type="text"
id="searchInput"
placeholder="🔍 顧客名で検索">

<div id="customerList">

読み込み中...

</div>

<button id="moreBtn">
もっと見る
</button>

</main>

<script type="module" src="../js/customers.js"></script>

</body>

</html>
