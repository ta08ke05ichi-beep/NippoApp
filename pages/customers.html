<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>顧客一覧</title>


<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/customers.css">


<link rel="manifest" href="../manifest.json">


</head>


<body>


<header>

<h1>👥 顧客管理</h1>

</header>



<main class="customer-container">



<!-- 顧客登録 -->

<section class="card">

<h2>顧客登録</h2>


<label>
顧客名
</label>

<input
id="customerName"
type="text"
placeholder="例：株式会社〇〇">


<label>
郵便番号
</label>

<input
id="postal"
type="text"
placeholder="例：123-4567">


<label>
住所1
</label>

<input
id="address1"
type="text"
placeholder="例：静岡県〇〇市">


<label>
住所2
</label>

<input
id="address2"
type="text"
placeholder="例：〇〇町1-2-3">


<label>
電話番号
</label>

<input
id="tel"
type="text"
placeholder="例：054-000-0000">


<button id="saveCustomerBtn">

顧客を登録

</button>


</section>






<!-- CSV取込 -->

<section class="card">

<h2>CSV一括登録</h2>


<input
type="file"
id="csvFile"
accept=".csv">


<button id="importBtn">

CSV取込

</button>


<p id="importStatus">

</p>


</section>






<!-- 検索 -->

<section class="card">

<h2>顧客検索</h2>


<input
id="searchInput"
type="text"
placeholder="顧客名・住所・電話番号で検索">


</section>






<!-- 顧客一覧 -->

<section class="card">

<h2>登録済み顧客</h2>


<div id="customerList">

読み込み中...

</div>


</section>




</main>
