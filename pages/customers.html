<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>顧客一覧</title>

<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/customers.css">

</head>

<body>

<header>

<h1>🏢 顧客一覧</h1>

</header>

<main>


<div id="customerForm" class="customer-form">

<h3>新規顧客登録</h3>

<input id="customerName" placeholder="顧客名">

<input id="postal" placeholder="郵便番号">

<input id="address1" placeholder="住所">

<input id="tel" placeholder="電話番号">


<button id="saveCustomerBtn">
登録
</button>


</div>

<div class="card">

<h2>📥 CSV取込</h2>

<input
type="file"
id="csvFile"
accept=".csv">

<button id="importBtn">

CSVを取り込む

</button>

<p id="importStatus"></p>

</div>

<input
id="searchInput"
type="text"
placeholder="会社名・住所・TELで検索">

<div id="customerList">

読み込み中...

</div>

<button id="moreBtn">
もっと見る
</button>

</main>

<script type="module" src="../js/customers.js"></script>

</body>

</html>
