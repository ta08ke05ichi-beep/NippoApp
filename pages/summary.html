<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>月間集計</title>

<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/summary.css">

</head>

<body>

<header>

<h1>📊 月間集計</h1>

</header>

<main>

<div class="card">

<label>年月</label>

<input type="month" id="month">

</div>

<div class="card">

<label>担当者</label>

<select id="name">

<option>竹市</option>
<option>坂田</option>
<option>西田</option>
<option>太田（相談役）</option>
<option>酒井</option>
<option>太田（社長）</option>

</select>

</div>

<button id="searchBtn">

集計する

</button>

<div id="result" class="card">

<h2>📊 集計結果</h2>

<p>訪問件数</p>

<h3 id="visitCount">
0件
</h3>

<hr>

<p>作業件数</p>

<h3 id="workCount">
0件
</h3>

<hr>

<p>訪問した顧客数</p>

<h3 id="customerCount">
0社
</h3>

</div>

</main>

<script type="module" src="../js/summary.js"></script>

</body>

</html>
