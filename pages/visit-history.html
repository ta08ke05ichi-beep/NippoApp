<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>訪問履歴</title>

<link
    rel="stylesheet"
    href="../css/common.css"
>

<link
    rel="stylesheet"
    href="../css/visit-history.css"
>

</head>


<body>


<header>

    <h1>📋 訪問履歴</h1>

</header>


<main>


    <!-- 顧客名 -->

    <div class="card">

        <h2 id="customerTitle">
            読み込み中...
        </h2>

    </div>


    <!-- 訪問履歴 -->

    <div class="card">

        <h2>
            📋 対応履歴
        </h2>


        <div id="visitList">

            読み込み中...

        </div>

    </div>


    <!-- 戻る -->

    <button id="backBtn">

        ← 訪問先一覧へ戻る

    </button>


</main>


<script
    type="module"
    src="../js/visit-history.js"
></script>


</body>

</html>
